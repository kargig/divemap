[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --asyncio-mode=auto
markers =
    auth: Authentication tests
    users: User management tests
    dive_sites: Dive sites tests
    diving_centers: Diving centers tests
    integration: Integration tests
    spatial: Tests that require MySQL with PostGIS spatial support (skip on SQLite)

filterwarnings =
    ignore:'crypt' is deprecated:DeprecationWarning
    # Starlette TestClient still imports anyio.abc.BlockingPortal (removed alias in anyio 4.x).
    # Fixed upstream in newer Starlette; keep silenced until we bump starlette past the fix.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient 