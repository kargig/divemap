[project]
name = "divemap-backend"
version = "0.1.0"
description = "Divemap Backend API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.16.4",
    "anyio>=4.4.0",
    "bcrypt==4.3.0",
    "boto3==1.35.0",
    "cachetools==5.5.2",
    "cryptography==45.0.5",
    "email-validator>=2.1.0",
    "fastapi==0.116.1",
    "fastapi-cache2==0.2.1",
    "fitdecode==0.11.0",
    "garmin-fit-sdk==21.158.0",
    "google-auth==2.40.3",
    "gunicorn>=22.0.0",
    "jinja2>=3.1.4",
    "nh3==0.2.20",
    "octo-deco==2.0.3",
    "openai==1.98.0",
    "orjson>=3.10.0",
    "passlib[bcrypt]==1.7.4",
    "pillow>=10.4.0",
    "psutil==6.1.0",
    "pydantic[email]>=2.10.0",
    "pyjwt[crypto]==2.10.1",
    "pymysql==1.1.1",
    "python-dotenv==1.0.0",
    "python-magic==0.4.27",
    "python-multipart==0.0.20",
    "rapidfuzz==3.14.3",
    "reportlab>=4.2.0",
    "slowapi==0.1.9",
    "starlette==0.47.2",
    "tenacity==8.2.3",
    "tiktoken>=0.7.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "freezegun==1.5.5",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.uv.sources]
octo-deco = { url = "https://github.com/kargig/divemap/releases/download/deps-v1/octo_deco-2.0.3-cp313-cp313-linux_x86_64.whl" }

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["backend", "."]
extend-exclude = [
    "divemap_venv",
    ".pytest_cache",
    "htmlcov",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (unused imports, undefined variables)
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade (Python 3.13 idioms)
]
ignore = [
    "B008",   # Do not perform function calls in argument defaults (FastAPI Depends/Query)
    "B904",   # Exception chaining (FastAPI route handlers use HTTPException without chaining)
    "E501",   # Line too long (handled by ruff format)
    "E701",   # Multiple statements on one line (handled by ruff format)
    "E402",   # Module level import not at top of file (common for setup before imports)
    "E712",   # Comparison to True/False (needed for SQLAlchemy .filter(Model.field == True))
    "W291",   # Trailing whitespace (handled by ruff format)
    "W292",   # No newline at end of file (handled by ruff format)
    "W293",   # Blank line contains whitespace (handled by ruff format)
    "UP042",  # Class inherits from both `str` and `enum.Enum` (SQLAlchemy Enum compatibility)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/dives_shared.py" = ["F401"]
"**/imports/common.py" = ["F401"]
"**/executors/base.py" = ["F401"]
"**/tests/*" = ["B018", "F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
