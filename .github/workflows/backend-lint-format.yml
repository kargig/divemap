name: Backend Lint & Format

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**/*.py'
      - 'backend/pyproject.toml'
      - 'backend/requirements.txt'
      - '.github/workflows/backend-lint-format.yml'
  pull_request:
    paths:
      - 'backend/**/*.py'
      - 'backend/pyproject.toml'
      - 'backend/requirements.txt'
      - '.github/workflows/backend-lint-format.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    name: Ruff Lint and Format
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install "ruff>=0.9.0"

      - name: Check Changed Python Files (PR)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }} -- 'backend/**/*.py' ':!backend/migrations/**' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Checking changed backend files:"
            echo "$CHANGED_FILES"
            ruff check --config backend/pyproject.toml $CHANGED_FILES
          else
            echo "No relevant backend Python files changed in this PR."
          fi

      - name: Check Formatting on Changed Files (PR)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }} -- 'backend/**/*.py' ':!backend/migrations/**' || true)
          if [ -n "$CHANGED_FILES" ]; then
            ruff format --check --config backend/pyproject.toml $CHANGED_FILES
          fi

      - name: Check Backend on Push / Manual Dispatch
        if: github.event_name != 'pull_request'
        run: |
          echo "Checking backend with Ruff..."
          ruff check --config backend/pyproject.toml backend/app/
          ruff format --check --config backend/pyproject.toml backend/app/
