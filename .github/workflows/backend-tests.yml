name: Backend Tests

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: false
        default: 'ci'
        type: choice
        options:
          - ci
          - development
          - staging
      run_migrations:
        description: 'Run database migrations'
        required: false
        default: true
        type: boolean
      run_tests:
        description: 'Run test suite'
        required: false
        default: true
        type: boolean
      run_coverage:
        description: 'Generate coverage reports'
        required: false
        default: true
        type: boolean

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: divemap_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv and Set up Python
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.10.2"
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: "backend/uv.lock"

    - name: Install dependencies
      run: |
        cd backend
        UV_PROJECT_ENVIRONMENT=divemap_venv uv sync --frozen



    - name: Set up environment variables
      run: |
        cd backend
        source divemap_venv/bin/activate
        export PYTHONPATH="/home/runner/work/divemap/divemap/backend/divemap_venv/lib/python3.13/site-packages:$PYTHONPATH"
        echo "PYTHONPATH=$PYTHONPATH" >> $GITHUB_ENV
        echo "DATABASE_URL=mysql+pymysql://root:password@localhost:3306/divemap_test" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-ci" >> $GITHUB_ENV
        echo "ENVIRONMENT=${{ github.event.inputs.environment || 'ci' }}" >> $GITHUB_ENV
        echo "GOOGLE_CLIENT_ID=dummy-client-id-for-testing" >> $GITHUB_ENV
        echo "GITHUB_ACTIONS=true" >> $GITHUB_ENV

    - name: Set up MySQL database
      if: ${{ github.event.inputs.run_migrations != 'false' || github.event_name != 'workflow_dispatch' }}
      run: |
        echo "Loading pre-seeded schema from database/init.sql..."
        if command -v mysql &> /dev/null; then
          mysql -h 127.0.0.1 -u root -ppassword divemap_test < database/init.sql
        else
          docker run --rm --network host -v "${PWD}/database/init.sql:/init.sql" mysql:8.0 bash -c "mysql -h 127.0.0.1 -u root -ppassword divemap_test < /init.sql"
        fi
        echo "✅ Pre-seeded database schema loaded (up to migration 0105)"

    - name: Run database migrations
      if: ${{ github.event.inputs.run_migrations != 'false' || github.event_name != 'workflow_dispatch' }}
      run: |
        cd backend
        source divemap_venv/bin/activate
        export DATABASE_URL="mysql+pymysql://root:password@localhost:3306/divemap_test"
        export PYTHONPATH="/home/runner/work/divemap/divemap/backend/divemap_venv/lib/python3.13/site-packages:$PYTHONPATH"
        alembic upgrade head

    - name: Run backend tests
      if: ${{ github.event.inputs.run_tests != 'false' || github.event_name != 'workflow_dispatch' }}
      run: |
        cd backend
        source divemap_venv/bin/activate
        python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=html --cov-report=xml -x --maxfail=1 --tb=short

    - name: Upload coverage reports
      if: ${{ (github.event.inputs.run_coverage != 'false' || github.event_name != 'workflow_dispatch') && always() }}
      uses: codecov/codecov-action@v5
      with:
        directory: ./backend/
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          backend/htmlcov/
          backend/.pytest_cache/ 
